name: CI / Production Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Automated Unit Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.nailexpress.ng
          NEXT_PUBLIC_SUPABASE_URL: https://ukfwpourkksctwmdgrci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_XsYdF7KDg7EIb-bngvJM_Q_YgGdHplO
          RESEND_API_KEY: re_dummy_ci_key
          OPENAI_API_KEY: sk-dummy-key-for-ci
          NODE_ENV: production



