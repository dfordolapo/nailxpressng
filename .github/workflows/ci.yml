name: CI / Production Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Automated Unit Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.nailexpress.ng
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ukfwpourkksctwmdgrci.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrZndwb3Vya2tzY3R3bWRncmNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTA3NjEsImV4cCI6MjA5OTcyNjc2MX0.AHjuszOA09bqiMPyAmymVer5RXrjiLfbqHkttuDMIRM' }}

